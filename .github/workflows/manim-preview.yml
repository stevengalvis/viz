name: Manim PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manim-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    name: Render scene
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Render medium-quality preview
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/manim" \
            --workdir /manim \
            manimcommunity/manim:v0.21.0 \
            manim -qm src/viz/scenes/loss_gradient.py LossGradientScene

      - name: Render native 1080p export
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/manim" \
            --workdir /manim \
            manimcommunity/manim:v0.21.0 \
            manim -qh src/viz/scenes/loss_gradient.py LossGradientScene

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Encode Safari-compatible preview
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          preview_source="media/videos/loss_gradient/720p30/LossGradientScene.mp4"
          export_source="media/videos/loss_gradient/1080p60/LossGradientScene.mp4"
          short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-12)"
          preview_name="LossGradientScene-${short_sha}-720p.mp4"
          export_name="LossGradientScene-${short_sha}-1080p.mp4"
          test -s "$preview_source"
          test -s "$export_source"
          mkdir -p preview

          ffmpeg -y \
            -i "$preview_source" \
            -map 0:v:0 \
            -map '0:a:0?' \
            -c:v libx264 \
            -preset medium \
            -crf 25 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            "preview/$preview_name"

          ffmpeg -y \
            -i "$export_source" \
            -map 0:v:0 \
            -an \
            -c:v libx264 \
            -preset slow \
            -crf 18 \
            -pix_fmt yuv420p \
            -r 60 \
            -movflags +faststart \
            "preview/$export_name"

          duration="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "preview/$preview_name")"
          midpoint="$(awk -v duration="$duration" 'BEGIN { printf "%.3f", duration / 2 }')"
          ffmpeg -y \
            -ss "$midpoint" \
            -i "preview/$preview_name" \
            -frames:v 1 \
            -q:v 2 \
            preview/poster.jpg

          export_spec="$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of csv=p=0 "preview/$export_name")"
          test "$export_spec" = "1920,1080,60/1"
          ffmpeg -v error -i "preview/$preview_name" -f null -
          ffmpeg -v error -i "preview/$export_name" -f null -
          test -s "preview/$preview_name"
          test -s "preview/$export_name"
          test -s preview/poster.jpg

      - name: Build preview page
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-12)"
          preview_name="LossGradientScene-${short_sha}-720p.mp4"
          export_name="LossGradientScene-${short_sha}-1080p.mp4"
          test -s "preview/$preview_name"
          test -s "preview/$export_name"
          test -s preview/poster.jpg
          cat > preview/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>LossGradientScene preview</title>
              <style>
                body { margin: 0 auto; max-width: 60rem; padding: 1rem; font-family: system-ui, sans-serif; }
                video { display: block; width: 100%; height: auto; background: #000; }
                code { overflow-wrap: anywhere; }
                .downloads { display: grid; gap: 0.75rem; margin-top: 1rem; }
                a { color: #0969da; font-size: 1.05rem; }
              </style>
            </head>
            <body>
              <h1>LossGradientScene</h1>
              <p>Pull request #${PR_NUMBER} · <code>${COMMIT_SHA}</code></p>
              <video controls playsinline preload="metadata" poster="poster.jpg">
                <source src="${preview_name}" type="video/mp4">
                Your browser does not support HTML5 video.
              </video>
              <div class="downloads">
                <a href="${export_name}" download>Download 1080p MP4</a>
                <a href="${preview_name}" download>Download 720p preview</a>
                <a href="${export_name}">Open 1080p video</a>
              </div>
            </body>
          </html>
          EOF
          test -s preview/index.html

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: manim-preview-pr-${{ github.event.pull_request.number }}
          path: preview
          if-no-files-found: error

  publish:
    name: Publish preview
    needs: render
    runs-on: ubuntu-latest
    concurrency:
      group: manim-pages-publish
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: manim-preview-pr-${{ github.event.pull_request.number }}
          path: preview

      - name: Publish PR-specific preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: preview
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Add preview link to pull request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- manim-preview -->';
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const repoPath = repo === `${owner}.github.io` ? '' : `/${repo}`;
            const previewUrl = `https://${owner}.github.io${repoPath}/pr-${number}/`;
            const shortSha = context.payload.pull_request.head.sha.slice(0, 12);
            const exportUrl = `${previewUrl}LossGradientScene-${shortSha}-1080p.mp4`;
            const body = `${marker}\n🎬 [Watch the Manim preview](${previewUrl})\n⬇️ [Download the 1080p MP4](${exportUrl})\n\nUpdated for \`${shortSha.slice(0, 7)}\`.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body,
              });
            }
