[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viz"
version = "0.1.0"
description = "Manim animations for visualizing deep-learning concepts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.21,<0.22",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/viz"]
